# Render blueprint for the Ledgerline demo: a free web service and a free PostgreSQL.
# Free PostgreSQL expires 30 days after creation (deleted 14 days later unless upgraded).
databases:
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline
    user: ledgerline
    postgresMajorVersion: "18"

services:
  - type: web
    name: ledgerline
    runtime: docker
    plan: free
    branch: main
    # Deploy only after the CI checks on main have passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      # Render asks for these when the blueprint is created. Keep them private.
      - key: LEDGERLINE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: LEDGERLINE_HOOKLINE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
